<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hala — A Private Community</title>
  <meta name="description" content="Hala is a private, members-only community. Membership is by application only." />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <meta property="og:title" content="Hala — A Private Community" />
  <meta property="og:description" content="A private, members-only community. By application only." />
  <meta property="og:image" content="https://halatheapp.com/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #FFFFFF;
      --ink: #22172A;
      --olive: #58181F;
      --muted: #7C7C8B;
      --hairline: rgba(34, 23, 42, 0.10);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      background: var(--cream);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    nav {
      display: flex;
      justify-content: center;
      gap: 44px;
      padding: 26px 24px;
      border-bottom: 1px solid var(--hairline);
    }
    nav a {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--ink);
      transition: color 0.2s ease;
    }
    nav a:hover { color: var(--olive); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 64px 24px;
    }
    .logo {
      width: 108px;
      height: 108px;
      border-radius: 50%;
    }
    .overline {
      margin-top: 40px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--olive);
    }
    .line {
      margin-top: 14px;
      font-size: 17px;
      font-weight: 400;
      color: var(--ink);
    }
    .pill {
      display: inline-block;
      margin-top: 36px;
      padding: 15px 34px;
      border-radius: 999px;
      background: var(--olive);
      color: var(--cream);
      font-size: 14.5px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .note {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    footer {
      border-top: 1px solid var(--hairline);
      padding: 30px 24px;
      display: flex;
      justify-content: center;
      gap: 44px;
      font-size: 13.5px;
      color: var(--muted);
    }
    footer a { color: var(--muted); transition: color 0.2s ease; }
    footer a:hover { color: var(--olive); }

    @media (max-width: 480px) {
      nav, footer { gap: 28px; }
      .logo { width: 92px; height: 92px; }
      .line { font-size: 16px; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="https://instagram.com/halatheapp" target="_blank" rel="noopener">Instagram</a>
  </nav>

  <main>
    <img class="logo" src="logo.png" alt="Hala" width="108" height="108" />
    <p class="overline">A Private Community</p>
    <p class="line">By application only.</p>
    <span class="pill">Coming Soon to the App&nbsp;Store</span>
    <p class="note">Membership is by application, through the app.</p>
  </main>

  <footer>
    <span>&copy;2026 Hala</span>
    <a href="/terms.html">Terms of Service</a>
    <a href="/privacy.html">Privacy Policy</a>
  </footer>
</body>
</html>
